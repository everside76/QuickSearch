name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    # 러너의 기본 stdout 인코딩(cp1252)에서는 한국어 로그가 UnicodeEncodeError 를 낸다
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 태그와 core/version.py 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_version.py ${{ github.ref_name }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 아이콘 생성
        run: python tools/make_icon.py

      - name: 임포트 스모크 테스트
        run: python -c "import quicksearch, core.updater, ui.update_manager, ui.app_icon; print('import ok')"

      - name: exe 빌드
        run: pyinstaller --noconfirm QuickSearch.spec

      - name: SHA-256 체크섬 생성
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/QuickSearch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  QuickSearch.exe" | Out-File -Encoding ascii -NoNewline dist/QuickSearch.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: QuickSearch-windows
          path: |
            dist/QuickSearch.exe
            dist/QuickSearch.exe.sha256
          retention-days: 14

      - name: 릴리스 게시
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickSearch.exe
            dist/QuickSearch.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
